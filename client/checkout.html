<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MyStore</title>
    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }

        .checkout-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1,
        h3 {
            color: #e74c3c;
            text-align: center;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .payment-option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .payment-option.selected {
            border-color: #e74c3c;
            background: #fff0f0;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="checkout-container">
        <h1>🛒 Checkout</h1>
        <form id="checkoutForm" onsubmit="handlePayment(event)">
            <h3>Shipping Details</h3>
            <label>Full Name *</label>
            <input type="text" id="fullName" required>
            <label>Email Address *</label>
            <input type="email" id="email" required>
            <label>Mobile Number *</label>
            <input type="tel" id="mobile" required>
            <label>Full Address *</label>
            <input type="text" id="address" required>
            <label>City *</label>
            <input type="text" id="city" required>

            <h3>Payment Method</h3>
            <div class="payment-options">
                <div class="payment-option selected" onclick="selectPayment(this)" data-value="cod">💵 COD</div>
                <div class="payment-option" onclick="selectPayment(this)" data-value="card">💳 Card/UPI</div>
            </div>
            <input type="hidden" id="paymentMethod" value="cod">
            <button type="submit">Place Order</button>
        </form>
    </div>

    <script>
        function selectPayment(el) {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('paymentMethod').value = el.getAttribute('data-value');
        }

        function handlePayment(e) {
            e.preventDefault();
            const method = document.getElementById('paymentMethod').value;
            if (method === 'cod') {
                alert("Order Placed via COD!");
                window.location.href = "success.html";
            } else {
                var options = {
                    "key": "rzp_test_SorQbuRg24Cbkt",
                    "amount": "50000",
                    "currency": "INR",
                    "name": "MyStore",
                    "handler": function (res) {
                        alert("Payment Success! ID: " + res.razorpay_payment_id);
                        window.location.href = "success.html";
                    }
                };
                var rzp = new Razorpay(options);
                rzp.open();
            }
        }
    </script>
</body>

</html>
